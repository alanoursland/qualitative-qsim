<svg xmlns="http://www.w3.org/2000/svg" width="790" height="200" font-family="monospace" font-size="12"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#666"/></marker></defs><text x="12" y="20">what determines what (instantaneous causal order)</text><line x1="568" y1="50" x2="642" y2="50" stroke="#666" stroke-dasharray="4" marker-end="url(#a)"/><line x1="718" y1="50" x2="192" y2="50" stroke="#666" marker-end="url(#a)"/><line x1="268" y1="50" x2="342" y2="50" stroke="#666" marker-end="url(#a)"/><line x1="418" y1="50" x2="492" y2="50" stroke="#666" marker-end="url(#a)"/><line x1="118" y1="120" x2="492" y2="50" stroke="#666" marker-end="url(#a)"/><ellipse cx="680" cy="50" rx="38" ry="18" fill="#efe" stroke="#333"/><text x="680" y="54" text-anchor="middle">amount</text><ellipse cx="80" cy="120" rx="38" ry="18" fill="#eef" stroke="#333"/><text x="80" y="124" text-anchor="middle">inflow</text><ellipse cx="230" cy="50" rx="38" ry="18" fill="#fff" stroke="#333"/><text x="230" y="54" text-anchor="middle">level</text><ellipse cx="380" cy="50" rx="38" ry="18" fill="#fff" stroke="#333"/><text x="380" y="54" text-anchor="middle">outflow</text><ellipse cx="530" cy="50" rx="38" ry="18" fill="#fff" stroke="#333"/><text x="530" y="54" text-anchor="middle">netflow</text><text x="12" y="192" fill="#777">dashed = integration (feedback over time); blue = input, green = state</text></svg>