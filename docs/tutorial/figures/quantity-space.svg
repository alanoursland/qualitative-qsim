<svg xmlns="http://www.w3.org/2000/svg" width="560" height="140" font-family="monospace" font-size="13"><text x="16" y="24">quantity space of "amount"</text><line x1="40" y1="70" x2="540" y2="70" stroke="#333" stroke-width="2"/><line x1="60" y1="60" x2="60" y2="80" stroke="#333" stroke-width="2"/><text x="60" y="52" text-anchor="middle">−∞</text><line x1="170" y1="60" x2="170" y2="80" stroke="#333" stroke-width="2"/><text x="170" y="52" text-anchor="middle">0</text><text x="170" y="120" text-anchor="middle" fill="#777">rank 0</text><text x="280" y="98" text-anchor="middle" fill="#b26a00">(0, FULL)</text><text x="280" y="120" text-anchor="middle" fill="#777">rank 1</text><line x1="390" y1="60" x2="390" y2="80" stroke="#333" stroke-width="2"/><text x="390" y="52" text-anchor="middle">FULL</text><text x="390" y="120" text-anchor="middle" fill="#777">rank 2</text><line x1="500" y1="60" x2="500" y2="80" stroke="#333" stroke-width="2"/><text x="500" y="52" text-anchor="middle">+∞</text><text x="16" y="136" fill="#777">even rank = at a landmark · odd rank = strictly between two</text></svg>