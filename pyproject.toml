[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qualitative-reasoning-lib"
version = "0.1.0a0"
description = "Qualitative reasoning about dynamical systems: QSIM and friends, with tensorized/GPU execution in PyTorch."
readme = "README.md"
requires-python = ">=3.10"
# License intentionally unset — see docs/open-questions.md #11.
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # Imported lazily so the symbolic core remains importable in constrained
    # inspection environments, but Torch is part of the supported install.
    "torch>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
viz = [
    "graphviz>=0.20",
]

[project.urls]
Homepage = "https://github.com/alanoursland/qualitative_reasoning_lib"
Repository = "https://github.com/alanoursland/qualitative_reasoning_lib"
Issues = "https://github.com/alanoursland/qualitative_reasoning_lib/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qrlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
