[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qualitative-reasoning-lib"
version = "0.0.1a0"
description = "Qualitative reasoning about dynamical systems: QSIM and friends, with tensorized/GPU execution in PyTorch."
readme = "README.md"
requires-python = ">=3.10"
# License intentionally unset — see docs/open-questions.md #7.
dependencies = [
    # torch is a declared dependency but is imported lazily and only inside
    # qrlib.tensor / qrlib.bridge; the symbolic core runs without it.
    "torch>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
viz = [
    "graphviz>=0.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qrlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
